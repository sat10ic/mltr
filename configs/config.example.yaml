# MLTR Configuration File
# Copy this to config.yaml and fill in your values

# ============================================================================
# General Settings
# ============================================================================
project:
  name: "MLTR Trading System"
  version: "0.1.0"
  timezone: "Asia/Kolkata"
  log_level: "INFO"  # DEBUG, INFO, WARNING, ERROR, CRITICAL

# ============================================================================
# Data Sources
# ============================================================================
data:
  # Market Data
  market:
    provider: "yfinance"  # yfinance, dhan, nse_official
    fallback_provider: "yfinance"

    # API credentials (if using paid providers)
    api_key: ""  # Set via environment variable: MLTR_MARKET_API_KEY
    api_secret: ""

    # Data refresh schedule
    fetch_interval_minutes: 60
    intraday_interval: "1m"  # 1m, 5m, 15m, 1h

    # Symbol universe
    universe: "NIFTY500"  # NIFTY50, NIFTY100, NIFTY200, NIFTY500, custom
    custom_symbols: []  # e.g., ["RELIANCE", "TCS", "INFY"]

    # Historical data
    historical_start_date: "2021-01-01"
    max_history_days: 730

  # News & Sentiment
  news:
    # NewsAPI
    newsapi:
      enabled: true
      api_key: ""  # Set via: MLTR_NEWSAPI_KEY
      sources: ["business-insider", "bloomberg", "financial-times"]
      country: "in"
      language: "en"

    # RSS Feeds
    rss:
      enabled: true
      feeds:
        - "https://economictimes.indiatimes.com/markets/stocks/rssfeeds/2146842.cms"
        - "https://www.moneycontrol.com/rss/marketreports.xml"
        - "https://www.business-standard.com/rss/markets-106.rss"

    # GDELT (optional)
    gdelt:
      enabled: false
      keywords: ["stock market", "NSE", "BSE", "India economy"]

  # Social Media
  social:
    # Twitter
    twitter:
      enabled: false  # Set to true if you have API access
      api_key: ""
      api_secret: ""
      bearer_token: ""
      keywords: ["$NIFTY", "NSE", "BSE", "stock market India"]

    # Reddit
    reddit:
      enabled: true
      client_id: ""
      client_secret: ""
      user_agent: "mltr-bot"
      subreddits: ["IndianStreetBets", "IndiaInvestments", "stocks"]

    # Telegram (optional)
    telegram:
      enabled: false
      channels: []

# ============================================================================
# Storage
# ============================================================================
storage:
  # Base data directory
  data_dir: "./data"

  # DuckDB databases
  duckdb:
    market_db: "data/db/market.db"
    news_db: "data/db/news.db"
    ml_db: "data/db/ml.db"
    knowledge_db: "data/db/knowledge.db"

  # Parquet storage
  parquet:
    ohlcv_dir: "data/processed/ohlcv"
    features_dir: "data/processed/features"
    partition_by: "date"  # date, symbol, or both

  # Model artifacts
  models:
    model_dir: "data/models"
    mlflow_uri: "file:///home/user/mltr/data/mlruns"

  # Vector database for RAG
  vector_db:
    type: "faiss"  # faiss, milvus, pinecone
    index_path: "data/knowledge/faiss_index"
    embedding_dim: 384  # sentence-transformers dimension

# ============================================================================
# Feature Engineering
# ============================================================================
features:
  # Technical indicators
  technical:
    # Momentum indicators
    momentum:
      rsi_periods: [14, 21]
      macd_fast: 12
      macd_slow: 26
      macd_signal: 9
      stochastic_k: 14
      stochastic_d: 3

    # Trend indicators
    trend:
      sma_periods: [20, 50, 100, 200]
      ema_periods: [10, 20, 50]
      adx_period: 14

    # Volatility indicators
    volatility:
      bollinger_period: 20
      bollinger_std: 2
      atr_period: 14
      keltner_period: 20

    # Volume indicators
    volume:
      obv_enabled: true
      vwap_enabled: true
      volume_sma_period: 20

  # Sentiment features
  sentiment:
    model: "distilbert-base-uncased-finetuned-sst-2-english"
    aggregation_windows: [1, 3, 7]  # days
    weight_by_reach: true
    credibility_threshold: 0.5

  # Meta features
  meta:
    regime_lookback: 60  # days for regime detection
    sector_rotation_period: 20
    correlation_window: 30

# ============================================================================
# Machine Learning
# ============================================================================
ml:
  # Target labeling
  targets:
    # Binary classification
    binary:
      forward_days: 5
      threshold_pct: 2.0  # 2% return

    # Regression
    regression:
      forward_days: 5

    # Triple barrier
    triple_barrier:
      profit_target_pct: 3.0
      stop_loss_pct: 1.5
      max_holding_days: 10

  # Training configuration
  training:
    # Cross-validation
    cv_folds: 5
    purge_days: 2
    embargo_days: 1

    # Train/test split
    test_size: 0.2
    validation_size: 0.1

    # Feature selection
    max_features: 50
    feature_selection_method: "mutual_info"  # mutual_info, rfe, boruta

    # Hyperparameter tuning
    optimization:
      enabled: true
      n_trials: 50
      timeout_seconds: 3600

  # Models
  models:
    # RandomForest
    random_forest:
      enabled: true
      n_estimators: 100
      max_depth: 10
      min_samples_split: 10
      class_weight: "balanced"

    # XGBoost
    xgboost:
      enabled: true
      n_estimators: 100
      max_depth: 6
      learning_rate: 0.1
      subsample: 0.8

    # LightGBM
    lightgbm:
      enabled: true
      n_estimators: 100
      max_depth: 8
      learning_rate: 0.1
      num_leaves: 31

  # Online learning (River)
  online:
    enabled: true
    model_type: "AdaptiveRandomForest"
    update_frequency_minutes: 5

  # Probability calibration
  calibration:
    method: "isotonic"  # platt, isotonic
    cv_folds: 5

# ============================================================================
# Signal Generation
# ============================================================================
signals:
  # Signal thresholds
  thresholds:
    min_confidence: 0.6
    dynamic_threshold: true  # Adjust based on volatility

  # Filters
  filters:
    min_liquidity_tier: 2  # 1: High, 2: Medium, 3: Low
    max_gap_pct: 5.0  # Skip if gap > 5%
    sentiment_alignment: true  # Require sentiment-price agreement

  # Sentiment modifiers
  sentiment:
    boost_factor: 0.1  # Add to confidence if positive
    penalty_factor: 0.15  # Subtract if negative

  # Regime filters
  regime:
    skip_bearish: false
    boost_bullish: true

# ============================================================================
# Risk Management
# ============================================================================
risk:
  # Position sizing
  position:
    risk_per_trade_pct: 1.0  # 1% of capital
    max_position_size_pct: 3.0  # 3% of capital per stock
    volatility_adjusted: true  # Use ATR for sizing

  # Portfolio limits
  portfolio:
    max_positions: 10
    max_sector_allocation_pct: 30
    max_correlation: 0.7  # Skip if corr > 0.7 with existing position

  # Stop loss & take profit
  exit:
    stop_loss:
      method: "atr"  # atr, fixed_pct, swing_low
      atr_multiplier: 2.0
      fixed_pct: 1.5

    take_profit:
      method: "risk_reward"  # risk_reward, fixed_pct
      risk_reward_ratio: 2.0
      fixed_pct: 3.0

    trailing_stop:
      enabled: true
      method: "ema"  # ema, atr
      ema_fast: 10
      ema_slow: 20
      atr_multiplier: 1.5

  # Daily limits
  daily:
    max_loss_pct: 2.0  # Kill switch at -2%
    max_trades: 5

# ============================================================================
# Backtesting
# ============================================================================
backtest:
  # Performance metrics
  metrics:
    - "sharpe_ratio"
    - "sortino_ratio"
    - "cagr"
    - "max_drawdown"
    - "win_rate"
    - "profit_factor"

  # Transaction costs
  costs:
    commission_pct: 0.03  # 0.03% per side
    slippage_pct: 0.02
    impact_cost: true

  # Indicator league
  indicator_league:
    enabled: true
    refresh_frequency: "weekly"
    top_n: 20
    min_sharpe: 0.5

  # Ablation testing
  ablation:
    enabled: true
    significance_threshold: 0.05
    min_improvement_pct: 5.0

# ============================================================================
# LLM Integration
# ============================================================================
llm:
  # Local LLM setup
  model:
    provider: "llamacpp"  # llamacpp, ollama
    model_name: "qwen2.5-7b-instruct"
    model_path: "models/llm/qwen2.5-7b-instruct-q4_k_m.gguf"

  # Inference settings
  inference:
    max_tokens: 2048
    temperature: 0.7
    top_p: 0.9
    context_length: 8192
    n_gpu_layers: 0  # Set > 0 if GPU available

  # Function calling
  functions:
    enabled: true
    available_functions:
      - "fetch_data"
      - "run_backtest"
      - "generate_signals"
      - "explain_signal"
      - "search_knowledge"
      - "ingest_document"

  # RAG settings
  rag:
    enabled: true
    top_k_results: 5
    reranking: false
    max_context_length: 2000

# ============================================================================
# Knowledge Base
# ============================================================================
knowledge:
  # Document ingestion
  ingestion:
    chunk_size: 512
    chunk_overlap: 50
    embedding_model: "sentence-transformers/all-MiniLM-L6-v2"

  # PDF processing
  pdf:
    extract_images: false
    ocr_enabled: false

  # GitHub ingestion
  github:
    clone_depth: 1
    file_types: [".py", ".ipynb", ".md"]
    exclude_dirs: ["tests", "docs", ".git"]

# ============================================================================
# API & Dashboard
# ============================================================================
api:
  host: "0.0.0.0"
  port: 8000
  reload: false  # Set true for development
  workers: 4

  # Authentication
  auth:
    enabled: false
    jwt_secret: ""  # Set via: MLTR_JWT_SECRET
    access_token_expire_minutes: 60

  # Rate limiting
  rate_limit:
    enabled: true
    requests_per_minute: 100

dashboard:
  host: "0.0.0.0"
  port: 8501
  theme: "dark"  # dark, light
  update_interval_seconds: 60

# ============================================================================
# Workflow Orchestration
# ============================================================================
workflow:
  orchestrator: "prefect"  # prefect, airflow

  # Schedules (IST)
  schedules:
    pre_market: "06:00"
    market_open: "09:15"
    market_close: "15:30"
    eod_processing: "16:00"
    weekly_review: "Sun 10:00"

  # Retry policy
  retry:
    max_attempts: 3
    delay_seconds: 60
    backoff_factor: 2

# ============================================================================
# Monitoring
# ============================================================================
monitoring:
  # Prometheus
  prometheus:
    enabled: false
    port: 9090

  # Grafana
  grafana:
    enabled: false
    port: 3000

  # Sentry
  sentry:
    enabled: false
    dsn: ""  # Set via: MLTR_SENTRY_DSN

  # Alerts
  alerts:
    email:
      enabled: false
      smtp_server: "smtp.gmail.com"
      smtp_port: 587
      from_email: ""
      to_emails: []

    telegram:
      enabled: false
      bot_token: ""
      chat_id: ""

# ============================================================================
# Feedback & Meta-Learning
# ============================================================================
feedback:
  # Trade logging
  logging:
    enabled: true
    log_all_signals: true

  # Meta-learning
  meta_learning:
    enabled: true
    review_frequency: "weekly"
    min_trades_for_update: 20

  # Threshold adaptation
  threshold_tuning:
    enabled: true
    learning_rate: 0.01
    max_adjustment: 0.1  # Max ±10% change per update

# ============================================================================
# Safety & Governance
# ============================================================================
safety:
  # Feature gating
  feature_gating:
    enabled: true
    canary_allocation_pct: 10
    significance_threshold: 0.05

  # Human approval
  approval:
    required_for_new_features: true
    required_for_high_risk_trades: false
    approval_timeout_hours: 24

  # Audit logging
  audit:
    enabled: true
    log_all_predictions: true
    log_all_signals: true
    retention_days: 365
