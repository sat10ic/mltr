[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mltr"
version = "0.1.0"
description = "LLM-Integrated ML Trading Research & Intelligence System for Indian Stock Market"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Your Name", email = "your.email@example.com"}
]
keywords = ["trading", "machine-learning", "stock-market", "llm", "nse", "bse"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "pandas>=2.1.0",
    "polars>=0.19.0",
    "numpy>=1.24.0",
    "duckdb>=0.9.0",
    "pyarrow>=13.0.0",
    "scikit-learn>=1.3.0",
    "xgboost>=2.0.0",
    "lightgbm>=4.1.0",
    "river>=0.19.0",
    "vectorbt>=0.26.0",
    "ta>=0.11.0",
    "pandas-ta>=0.3.14b",
    "spacy>=3.6.0",
    "transformers>=4.33.0",
    "sentence-transformers>=2.2.2",
    "torch>=2.0.0",
    "bertopic>=0.15.0",
    "faiss-cpu>=1.7.4",
    "langchain>=0.0.300",
    "llama-index>=0.9.0",
    "fastapi>=0.103.0",
    "uvicorn[standard]>=0.23.0",
    "pydantic>=2.3.0",
    "streamlit>=1.27.0",
    "plotly>=5.17.0",
    "mlflow>=2.7.0",
    "optuna>=3.3.0",
    "prefect>=2.13.0",
    "yfinance>=0.2.28",
    "beautifulsoup4>=4.12.0",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
    "loguru>=0.7.0",
    "rich>=13.5.0",
    "click>=8.1.7",
    "tqdm>=4.66.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.21.0",
    "pytest-mock>=3.11.0",
    "black>=23.9.0",
    "isort>=5.12.0",
    "flake8>=6.1.0",
    "mypy>=1.5.0",
    "pylint>=2.17.0",
    "ipython>=8.15.0",
    "jupyter>=1.0.0",
]

llm = [
    "llama-cpp-python>=0.2.0",
    "langchain-community>=0.0.10",
]

cloud = [
    "boto3>=1.28.0",
    "google-cloud-storage>=2.10.0",
]

timescale = [
    "psycopg2-binary>=2.9.7",
]

all = [
    "mltr[dev,llm,cloud,timescale]",
]

[project.urls]
Homepage = "https://github.com/yourusername/mltr"
Documentation = "https://github.com/yourusername/mltr/docs"
Repository = "https://github.com/yourusername/mltr"
Issues = "https://github.com/yourusername/mltr/issues"

[project.scripts]
mltr = "src.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.black]
line-length = 100
target-version = ['py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
  | data
)/
'''

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
skip_gitignore = true

[tool.pylint.messages_control]
disable = [
    "C0111",  # missing-docstring
    "C0103",  # invalid-name
    "R0913",  # too-many-arguments
    "R0914",  # too-many-locals
]
max-line-length = 100

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_optional = true

[[tool.mypy.overrides]]
module = [
    "pandas.*",
    "numpy.*",
    "sklearn.*",
    "xgboost.*",
    "lightgbm.*",
    "vectorbt.*",
    "ta.*",
    "pandas_ta.*",
    "spacy.*",
    "transformers.*",
    "faiss.*",
    "langchain.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov=src",
    "--cov-report=term-missing",
    "--cov-report=html",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "e2e: marks tests as end-to-end tests",
    "llm: marks tests requiring LLM",
]

[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__init__.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
